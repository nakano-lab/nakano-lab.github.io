<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Nakano Lab Software — research-driven apps for everyday work.">
  <title>Nakano Lab Software</title>
  <link rel="icon" href="/assets/images/wayaknow/icon.png">
  <link rel="stylesheet" href="/assets/css/site.css">
  <script>
    (function () {
      var language;
      try { language = localStorage.getItem("nakano-lab-site-language"); } catch (_) {}
      if (language !== "ja" && language !== "en") {
        language = navigator.language && navigator.language.toLowerCase().startsWith("ja") ? "ja" : "en";
      }
      location.replace("/" + language + "/");
    })();
  </script>
</head>
<body>
  <main class="container page-hero">
    <p class="eyebrow">Nakano Lab Software</p>
    <h1 class="section-title">言語を選択してください<br>Please choose a language</h1>
    <div class="button-row">
      <a class="button primary" href="/ja/">日本語</a>
      <a class="button" href="/en/">English</a>
    </div>
  </main>
</body>
</html>
